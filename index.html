<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamMaster Pro | M3U Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #4cc9f0;
            --danger: #ef233c;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1b263b;
            --text-light: #778da9;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            /* Or darker professional gradient: background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); */
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }

        /* --- Login Screen --- */
        #login-view {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .login-logo i { font-size: 3rem; color: #fff; margin-bottom: 1rem; display: inline-block; }
        .login-card h1 { color: #fff; margin-bottom: 0.5rem; font-weight: 800; }
        .login-card p { color: rgba(255,255,255,0.8); margin-bottom: 2rem; }

        .input-group { position: relative; margin-bottom: 1.5rem; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        
        .glass-input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.6);
            font-size: 1rem;
            transition: 0.3s;
        }
        .glass-input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.2); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--text-main);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* --- Main App UI --- */
        #app-view { display: none; width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px; height: 100vh; flex-direction: column; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: var(--primary-dark); }
        .user-menu button { background: none; border: none; color: var(--danger); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            flex: 1;
            overflow: hidden; /* Important for inner scrolling */
        }

        /* Sidebar */
        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: var(--shadow);
        }

        .upload-zone {
            border: 2px dashed var(--primary);
            background: rgba(67, 97, 238, 0.05);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-zone:hover { background: rgba(67, 97, 238, 0.1); }
        .upload-icon { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: rgba(255,255,255,0.5); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary-dark); }
        .stat-label { font-size: 0.8rem; color: var(--text-light); }

        .tools-section h3 { font-size: 0.9rem; text-transform: uppercase; color: var(--text-light); margin-bottom: 10px; letter-spacing: 1px; }

        /* Main Editor */
        .editor-panel {
            background: #fff;
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .editor-toolbar {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
        }
        .search-bar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #adb5bd; }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .channel-item {
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            padding: 15px 20px;
            border-bottom: 1px solid #f1f1f1;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .channel-item:hover { background: #f8f9fa; }
        .channel-item.active { background: rgba(67, 97, 238, 0.05); border-left: 4px solid var(--primary); }
        
        .ch-icon { 
            width: 32px; height: 32px; background: #eee; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; color: #777;
        }
        .ch-info { padding: 0 15px; }
        .ch-name { font-weight: 600; color: var(--text-main); font-size: 0.95rem; margin-bottom: 4px; display: block; }
        .ch-url { color: var(--text-light); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; display: block; font-family: monospace; }
        
        .edit-btn { color: var(--primary); background: none; border: none; cursor: pointer; opacity: 0.5; }
        .channel-item:hover .edit-btn { opacity: 1; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            animation: fadeIn 0.3s ease;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .btn-sm { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-ghost { background: #f1f1f1; color: #555; }
        .btn-save { background: var(--success); color: #fff; }

        /* Utilities */
        .hidden { display: none !important; }
        .text-danger { color: var(--danger); font-size: 0.85rem; margin-top: 5px; display: none; }
        
        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            #app-view { height: auto; }
            .channel-list { max-height: 500px; }
        }
    </style>
</head>
<body>

    <div id="login-view" class="fade-in">
        <div class="login-card">
            <div class="login-logo">
                <i class="ri-play-list-add-line"></i>
            </div>
            <h1>M3U Manager Pro</h1>
            <p>Professional Playlist Editor & Validator</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <i class="ri-user-line"></i>
                    <input type="text" id="username" class="glass-input" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="ri-lock-line"></i>
                    <input type="password" id="password" class="glass-input" placeholder="Password" required>
                </div>
                <div id="loginError" class="text-danger" style="display: none; margin-bottom: 15px;">
                    <i class="ri-error-warning-fill"></i> Invalid credentials
                </div>
                <button type="submit" class="btn-primary">Authenticate</button>
            </form>
        </div>
    </div>

    <div id="app-view">
        <header>
            <div class="brand">
                <i class="ri-folder-music-line"></i> StreamMaster Pro
            </div>
            <div class="user-menu">
                <button id="logoutBtn"><i class="ri-logout-box-r-line"></i> Logout</button>
            </div>
        </header>

        <div class="dashboard-grid">
            
            <aside class="sidebar fade-in">
                
                <div class="upload-zone" id="dropZone">
                    <input type="file" id="fileInput" accept=".m3u,.m3u8" hidden>
                    <div class="upload-icon"><i class="ri-upload-cloud-2-line"></i></div>
                    <h4>Load M3U File</h4>
                    <p style="font-size: 0.8rem; color: #777;">Drag & Drop or Click</p>
                </div>

                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-val" id="totalChannels">0</div>
                        <div class="stat-label">Total Channels</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalGroups">0</div>
                        <div class="stat-label">Groups</div>
                    </div>
                </div>

                <div class="tools-section">
                    <h3>Bulk Operations</h3>
                    <div class="input-group">
                        <input type="text" id="findText" class="glass-input" placeholder="Find (e.g., old-server.com)" style="padding: 8px; margin-bottom: 5px;">
                        <input type="text" id="replaceText" class="glass-input" placeholder="Replace (e.g., new-dns.me)" style="padding: 8px;">
                        <button class="btn-primary" id="bulkReplaceBtn" style="margin-top: 10px; padding: 10px;">Replace All Domains</button>
                    </div>
                </div>

                <div class="tools-section" style="margin-top: auto;">
                    <button class="btn-primary" id="downloadBtn" style="background: var(--success);">
                        <i class="ri-download-line"></i> Download Modified M3U
                    </button>
                </div>
            </aside>

            <main class="editor-panel fade-in">
                <div class="editor-toolbar">
                    <div class="search-bar">
                        <i class="ri-search-line"></i>
                        <input type="text" id="searchInput" placeholder="Search channels by name or URL...">
                    </div>
                    <div style="font-size: 0.85rem; color: #777;">
                        Showing <span id="visibleCount">0</span> streams
                    </div>
                </div>

                <div class="channel-list" id="channelList">
                    <div style="text-align: center; padding: 50px; color: #999;">
                        <i class="ri-file-list-3-line" style="font-size: 3rem; margin-bottom: 10px;"></i>
                        <p>No playlist loaded. Upload an M3U file to begin.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Stream</h3>
                <i class="ri-close-line" id="closeModal" style="cursor: pointer; font-size: 1.5rem;"></i>
            </div>
            <div class="form-group">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Channel Name</label>
                <input type="text" id="editName" class="glass-input" style="border: 1px solid #ddd;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Stream URL</label>
                <input type="text" id="editUrl" class="glass-input" style="border: 1px solid #ddd;">
            </div>
            <div class="modal-footer">
                <button class="btn-sm btn-ghost" id="cancelEdit">Cancel</button>
                <button class="btn-sm btn-save" id="saveEdit">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- App State ---
        const state = {
            isLoggedIn: false,
            playlist: [], // Array of objects: { name, logo, group, url, rawLine }
            originalHeader: '#EXTM3U',
            currentEditIndex: -1
        };

        // --- DOM Elements ---
        const loginView = document.getElementById('login-view');
        const appView = document.getElementById('app-view');
        const loginForm = document.getElementById('loginForm');
        const channelList = document.getElementById('channelList');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');
        const editModal = document.getElementById('editModal');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('m3u_auth') === 'true') {
                showApp();
            }
        });

        // --- Auth Logic ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            
            // Hardcoded as requested
            if (u === 'rkboi' && p === '0786') {
                sessionStorage.setItem('m3u_auth', 'true');
                showApp();
            } else {
                const err = document.getElementById('loginError');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('m3u_auth');
            location.reload();
        });

        function showApp() {
            loginView.style.display = 'none';
            appView.style.display = 'flex';
        }

        // --- File Handling ---
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(67, 97, 238, 0.2)'; });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.background = ''; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = '';
            handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => parseM3U(e.target.result);
            reader.readAsText(file);
        }

        // --- Core Parser Logic ---
        function parseM3U(content) {
            const lines = content.split(/\r?\n/);
            state.playlist = [];
            
            if (lines[0].startsWith('#EXTM3U')) {
                state.originalHeader = lines[0];
            }

            let currentItem = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('#EXTINF:')) {
                    // Extract Name
                    const nameParts = line.split(',');
                    const name = nameParts[nameParts.length - 1];
                    
                    // Extract Logo (Simple regex)
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const groupMatch = line.match(/group-title="([^"]*)"/);

                    currentItem = {
                        name: name || 'Unknown Channel',
                        logo: logoMatch ? logoMatch[1] : null,
                        group: groupMatch ? groupMatch[1] : 'Uncategorized',
                        rawInfo: line
                    };
                } else if (!line.startsWith('#')) {
                    // It's a URL
                    if (currentItem.rawInfo) {
                        currentItem.url = line;
                        state.playlist.push(currentItem);
                        currentItem = {}; // Reset
                    }
                }
            }

            updateStats();
            renderList(state.playlist);
        }

        // --- Rendering ---
        function renderList(items) {
            channelList.innerHTML = '';
            document.getElementById('visibleCount').innerText = items.length;

            if (items.length === 0) {
                channelList.innerHTML = '<div style="padding:20px; text-align:center;">No channels found.</div>';
                return;
            }

            // Virtual scrolling optimization (rendering first 100 for speed)
            // In a real pro app, we'd use intersection observer.
            // For this demo, we render max 200 items to keep DOM light.
            const limit = Math.min(items.length, 200); 

            items.slice(0, limit).forEach((item, index) => {
                // Find actual index in main array for editing
                const realIndex = state.playlist.indexOf(item);
                
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `
                    <div class="ch-icon">${item.name.substring(0,2).toUpperCase()}</div>
                    <div class="ch-info">
                        <span class="ch-name">${item.name}</span>
                        <span class="ch-url">${item.url}</span>
                    </div>
                    <button class="edit-btn" onclick="openEdit(${realIndex})"><i class="ri-pencil-fill"></i></button>
                `;
                channelList.appendChild(div);
            });
            
            if (items.length > 200) {
                const more = document.createElement('div');
                more.style.padding = '15px';
                more.style.textAlign = 'center';
                more.style.color = '#777';
                more.innerText = `...and ${items.length - 200} more items hidden for performance...`;
                channelList.appendChild(more);
            }
        }

        function updateStats() {
            document.getElementById('totalChannels').innerText = state.playlist.length;
            const groups = new Set(state.playlist.map(i => i.group));
            document.getElementById('totalGroups').innerText = groups.size;
        }

        // --- Search ---
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = state.playlist.filter(item => 
                item.name.toLowerCase().includes(term) || 
                item.url.toLowerCase().includes(term)
            );
            renderList(filtered);
        });

        // --- Editing ---
        window.openEdit = (index) => {
            state.currentEditIndex = index;
            const item = state.playlist[index];
            document.getElementById('editName').value = item.name;
            document.getElementById('editUrl').value = item.url;
            editModal.style.display = 'flex';
        };

        document.getElementById('closeModal').addEventListener('click', () => editModal.style.display = 'none');
        document.getElementById('cancelEdit').addEventListener('click', () => editModal.style.display = 'none');

        document.getElementById('saveEdit').addEventListener('click', () => {
            if (state.currentEditIndex > -1) {
                const newName = document.getElementById('editName').value;
                const newUrl = document.getElementById('editUrl').value;
                
                // Update object
                state.playlist[state.currentEditIndex].name = newName;
                state.playlist[state.currentEditIndex].url = newUrl;
                
                // Update Raw Info string (simple replacement of name)
                const parts = state.playlist[state.currentEditIndex].rawInfo.split(',');
                parts.pop(); // Remove old name
                state.playlist[state.currentEditIndex].rawInfo = parts.join(',') + ',' + newName;

                renderList(state.playlist); // Re-render
                editModal.style.display = 'none';
            }
        });

        // --- Bulk Actions ---
        document.getElementById('bulkReplaceBtn').addEventListener('click', () => {
            const find = document.getElementById('findText').value;
            const replace = document.getElementById('replaceText').value;
            
            if (!find) return alert('Please enter text to find');

            let count = 0;
            state.playlist.forEach(item => {
                if (item.url.includes(find)) {
                    item.url = item.url.split(find).join(replace);
                    count++;
                }
            });

            alert(`Updated ${count} URLs.`);
            renderList(state.playlist);
        });

        // --- Export / Download ---
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (state.playlist.length === 0) return alert('No playlist to download');

            let output = state.originalHeader + '\n';
            state.playlist.forEach(item => {
                output += item.rawInfo + '\n';
                output += item.url + '\n';
            });

            const blob = new Blob([output], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'updated_playlist.m3u';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

    </script>
</body>
</html>
